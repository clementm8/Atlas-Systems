<!DOCTYPE html>
<html lang="en">
<head>
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-T724HHWQ');</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Systems · Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #09090b;
            --bg-surface: #18181b;
            --bg-elevated: #27272a;
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #27272a;
            --radius-md: 8px;
            --radius-lg: 12px;
            --font-sans: 'Sora', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            min-height: 100%;
            background: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-weight: 300;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 32px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 24px;
            letter-spacing: -0.01em;
        }

        .form-group { margin-bottom: 16px; }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text-primary);
            transition: border-color 0.15s ease, background 0.15s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg-elevated);
        }

        .btn {
            width: 100%;
            margin-top: 8px;
            padding: 12px 16px;
            background: var(--accent);
            color: #fff;
            border: 1px solid var(--accent);
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.05s ease;
        }

        .btn:hover { background: var(--accent-hover); }
        .btn:active { transform: translateY(1px); }

        .btn.secondary {
            background: transparent;
            color: var(--text-primary);
            border-color: var(--border);
        }
        .btn.secondary:hover { background: var(--bg-elevated); }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 18px 0 12px;
            color: var(--text-muted);
            font-size: 0.75rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
    </style>
</head>
<body>
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-T724HHWQ"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

    <main class="page">
        <div class="card">
            <h1>Sign in</h1>
            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn" id="login-btn">Sign In</button>

                <div class="divider">or</div>

                <button type="button" class="btn secondary" id="signup-btn">Sign Up</button>
            </form>
        </div>
    </main>

    <script>
        window.dataLayer = window.dataLayer || [];

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            if (!email || !password) return;

            window.dataLayer.push({
                event: 'login_submit',
                method: 'email',
                user_email_hash: btoa(email).slice(0, 12)
            });

            sessionStorage.setItem('atlas_user_email', email);

            function goToDashboard() {
                window.location.href = 'dashboard.html';
            }

            if (window.MedianBridge && typeof MedianBridge.runAuthSave === 'function') {
                MedianBridge.runAuthSave(goToDashboard);
            } else {
                goToDashboard();
            }
        });
    </script>
</body>
</html>
